    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "سنونو",
        "url": "https://snono-dev.github.io/ta3reebat/",
        "description": "موقع تعريب الألعاب",
        "inLanguage": "ar"
    }

<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-P3XTKXKB"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <header>
        <div class="container">
            <div class="logo-container">
                <img src="images/logo.png" alt="سنونو" class="site-logo">
            </div>
            <h1>سنونو</h1>
            <p>تعريب الألعاب</p>
            <p class="disclaimer">جميع التعريبات غير رسمية وليست مرتبطة بأي جهة رسمية</p>
        </div>
    </header>

    <nav>
        <div class="container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ابحث عن لعبة...">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
            <div class="filters">
                <select id="categoryFilter">
                    <option value="all">جميع التصنيفات</option>
                    <option value="action">أكشن</option>
                    <option value="adventure">مغامرات</option>
                    <option value="rpg">تقمص ادوار</option>
                    <option value="strategy">استراتيجية</option>
                    <option value="simulation">محاكاة</option>
                    <option value="sports">رياضية</option>
                    <option value="puzzle">أحجية</option>
                </select>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="stats">
            <div class="stat-item">
                <i class="fas fa-gamepad"></i>
                <span id="totalGames">0</span>
                <p>لعبة مترجمة</p>
            </div>
            <div class="stat-item">
                <i class="fas fa-star"></i>
                <span id="totalFeatured">0</span>
                <p>لعبة مميزة</p>
            </div>
        </div>

        <div id="gamesContainer" class="games-grid"></div>

        <div id="loading" class="loading">
            <i class="fas fa-spinner fa-spin"></i>
            <p>جاري التحميل...</p>
        </div>

        <div id="noResults" class="no-results" style="display: none;">
            <i class="fas fa-search"></i>
            <p>لم يتم العثور على نتائج</p>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 سنونو - تعريب الألعاب. جميع الحقوق محفوظة.</p>
            <p class="disclaimer">جميع التعريبات غير رسمية وليست مرتبطة بأي جهة رسمية</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>initMainPage();</script>
</body>
